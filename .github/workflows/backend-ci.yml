name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test formatter automation
        run: python3 -m unittest discover -s ../scripts/tests -v

      - name: Check Java formatting
        run: python3 ../scripts/format-ci.py backend

      - name: Run backend tests
        run: ./gradlew test
