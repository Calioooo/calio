name: iOS CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Run iOS tests
      working-directory: ios
      run: |
        xcodebuild test \
          -scheme Calio \
          -destination 'platform=iOS Simulator,name=iPhone 15'