spring:
  application:
    name: calio
  datasource:
    url: jdbc:mysql://localhost:3306/calendar
    username: calendar
    password: calendar
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: never

external:
  holiday:
    base-url: http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo
    service-key: ${HOLIDAY_API_SERVICE_KEY:}
