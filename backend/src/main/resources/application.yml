spring:
  application:
    name: calio
  datasource:
    url: jdbc:mysql://localhost:3306/calendar
    username: calendar
    password: calendar
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: never

external:
  holiday:
    base-url: http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo
    service-key: ${HOLIDAY_API_SERVICE_KEY:}
  google:
    oauth:
      token-url: https://oauth2.googleapis.com/token
      user-info-url: https://www.googleapis.com/oauth2/v3/userinfo
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}

security:
  token-encryption:
    google-refresh-token-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
