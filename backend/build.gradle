plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.calio'
version = '0.0.1-SNAPSHOT'
description = 'calio'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.mnode.ical4j:ical4j:4.3.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/CalendarAssistantEvalTest.class'
}

tasks.register('aiCalendarEval', Test) {
    group = 'verification'
    description = 'Runs AI calendar evaluations against the configured OpenAI model.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'spring.profiles.active', 'ai-calendar-eval'
    useJUnitPlatform()
    include '**/CalendarAssistantEvalTest.class'
    outputs.upToDateWhen { false }
    doFirst {
        if (System.getenv('OPENAI_API_KEY') == null || System.getenv('OPENAI_API_KEY').isBlank()) {
            throw new GradleException('OPENAI_API_KEY is required to run aiCalendarEval.')
        }
        if (System.getenv('OPENAI_CHAT_MODEL') == null || System.getenv('OPENAI_CHAT_MODEL').isBlank()) {
            throw new GradleException('OPENAI_CHAT_MODEL is required to run aiCalendarEval.')
        }
        if (System.getenv('OPENAI_CHAT_REASONING_EFFORT') == null
                || System.getenv('OPENAI_CHAT_REASONING_EFFORT').isBlank()) {
            throw new GradleException('OPENAI_CHAT_REASONING_EFFORT is required to run aiCalendarEval.')
        }
    }
}
