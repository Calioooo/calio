services:
  mysql:
    image: mysql:8.4
    container_name: calio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - calio-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - calio-network
    logging: &bounded-docker-logs
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/calioooo/calio-backend:latest
    container_name: calio-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      HOLIDAY_API_SERVICE_KEY: ${HOLIDAY_API_SERVICE_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - calio-network
    logging: *bounded-docker-logs

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: calio-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - calio-prometheus-data:/prometheus
    networks:
      - calio-network
    logging: *bounded-docker-logs

  loki:
    image: grafana/loki:3.3.2
    container_name: calio-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - calio-loki-data:/loki
    networks:
      - calio-network
    logging: *bounded-docker-logs

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: calio-alloy
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - calio-alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - calio-network
    logging: *bounded-docker-logs

  grafana:
    image: grafana/grafana:11.5.2
    container_name: calio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${GRAFANA_DOMAIN}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - calio-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - calio-network
    logging: *bounded-docker-logs

volumes:
  calio-mysql-data:
  calio-prometheus-data:
  calio-loki-data:
  calio-alloy-data:
  calio-grafana-data:

networks:
  calio-network:
    driver: bridge
